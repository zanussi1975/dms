<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Obiegu Dokumentów (DMS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- SYSTEM MOTYWYWÓW CSS -->
    <style>
        /* 1. MIĘTOWA ŚWIEŻOŚĆ (Domyślny / Opcja 3) */
        body.theme-mint {
            --nav-bg: #2C3E50;
            --nav-text: #ffffff;
            --body-bg: #F4F7F6;
            --card-hdr-bg: #D8E2DC;
            --card-hdr-text: #2F3E46;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --btn-main: #2D6A4F;
            --btn-main-hover: #1B4332;
            --border-color: #CED4DA;
            
            /* Zmienne dla formularzy */
            --input-bg: #ffffff;
            --input-text: #212529;
            --input-border: #CED4DA;
        }

        /* 2. KORPORACYJNY BŁĘKIT (Opcja 1) */
        body.theme-corporate {
            --nav-bg: #1E3A8A;
            --nav-text: #ffffff;
            --body-bg: #F0F4F8;
            --card-hdr-bg: #DBEAFE;
            --card-hdr-text: #1E3A8A;
            --card-bg: #ffffff;
            --text-main: #0F172A;
            --text-muted: #64748b;
            --btn-main: #2563EB;
            --btn-main-hover: #1D4ED8;
            --border-color: #CBD5E1;
            
            --input-bg: #ffffff;
            --input-text: #0F172A;
            --input-border: #CBD5E1;
        }

        /* 3. CIEPŁY MINIMALIZM (Opcja 2) */
        body.theme-warm {
            --nav-bg: #4A3525;
            --nav-text: #FDFBF7;
            --body-bg: #FAF8F5;
            --card-hdr-bg: #F4E8D8;
            --card-hdr-text: #4A3525;
            --card-bg: #FDFBF7;
            --text-main: #4A3525;
            --text-muted: #8c7b6d;
            --btn-main: #C86D51;
            --btn-main-hover: #A85338;
            --border-color: #E6DCCD;
            
            --input-bg: #ffffff; /* Celowo czysta biel by pole lekko się odcinało od tła paneli */
            --input-text: #4A3525;
            --input-border: #E6DCCD;
        }

        /* 4. SOFT DARK (Opcja 4) */
        body.theme-dark {
            --nav-bg: #1A1D20;
            --nav-text: #E9ECEF;
            --body-bg: #212529;
            --card-hdr-bg: #343A40;
            --card-hdr-text: #F8F9FA;
            --card-bg: #2C3034;
            --text-main: #F8F9FA;
            --text-muted: #adb5bd;
            --btn-main: #495057;
            --btn-main-hover: #343A40;
            --border-color: #495057;
            
            /* W trybie ciemnym inputy są jeszcze ciemniejsze niż tło, co daje efekt "wgłębienia" */
            --input-bg: #212529;
            --input-text: #F8F9FA;
            --input-border: #495057;
        }

        /* KLASY POMOCNICZE OPARTE NA ZMIENNYCH */
        body {
            background-color: var(--body-bg) !important;
            color: var(--text-main) !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .custom-navbar {
            background-color: var(--nav-bg) !important;
            color: var(--nav-text) !important;
        }
        .custom-card-header {
            background-color: var(--card-hdr-bg) !important;
            color: var(--card-hdr-text) !important;
            border-bottom: 1px solid var(--border-color);
        }
        .custom-card-body {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
        }
        .custom-list-item {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }
        .custom-text-muted {
            color: var(--text-muted) !important;
        }
        .custom-border {
            border-color: var(--border-color) !important;
        }
        
        .custom-btn-main {
            background-color: var(--btn-main) !important;
            color: #ffffff !important;
            border: none;
        }
        .custom-btn-main:hover {
            background-color: var(--btn-main-hover) !important;
            color: #ffffff !important;
        }

        /* --- STYLOWANIE FORMULARZY (Nadpisywanie Bootstrapa) --- */
        .form-control, .form-select {
            background-color: var(--input-bg) !important;
            color: var(--input-text) !important;
            border-color: var(--input-border) !important;
        }
        /* Zachowanie przy kliknięciu (focus) */
        .form-control:focus, .form-select:focus {
            border-color: var(--btn-main) !important;
            box-shadow: 0 0 0 0.25rem rgba(45, 106, 79, 0.25) !important; /* Delikatna poświata */
        }
        /* Kolor tekstu podpowiedzi (placeholder) */
        .form-control::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.8;
        }
        /* Stylowanie szarego przycisku "Przeglądaj/Wybierz plik" wew. input type="file" */
        .form-control::file-selector-button {
            background-color: var(--card-hdr-bg) !important;
            color: var(--card-hdr-text) !important;
            border: none !important;
            border-right: 1px solid var(--input-border) !important;
            margin-right: 10px;
            transition: all 0.2s;
        }
        /* --- STYLOWANIE MENU ROZWIJANEGO (DROPDOWN) --- */
        .custom-dropdown-menu {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
        }
        .custom-dropdown-item {
            color: var(--text-main) !important;
            transition: background-color 0.2s;
        }
        .custom-dropdown-item:hover, .custom-dropdown-item:focus {
            background-color: var(--card-hdr-bg) !important;
            color: var(--text-main) !important;
        }
        /* --- STYLOWANIE TABEL W MOTYWACH --- */
        .custom-table {
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
        }
        .custom-table th {
            background-color: var(--card-hdr-bg) !important;
            color: var(--card-hdr-text) !important;
            border-bottom: 2px solid var(--border-color) !important;
            font-weight: 600;
        }
        .custom-table td {
            background-color: var(--card-bg) !important;
            color: var(--text-main) !important;
            border-bottom: 1px solid var(--border-color) !important;
        }
        /* Efekt podświetlenia wiersza przy najechaniu myszką */
        .custom-table tbody tr:hover td {
            background-color: var(--card-hdr-bg) !important;
            opacity: 0.95;
            transition: background-color 0.2s;
        }

        /* --- STYLOWANIE BOCZNEGO MENU (SIDEBAR) --- */
        .sidebar-card {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
        }
        .sidebar-item {
            color: var(--text-main) !important;
            border-radius: 6px;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            padding: 10px 15px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .sidebar-item:hover, .sidebar-item.active {
            background-color: var(--card-hdr-bg) !important;
            color: var(--text-main) !important;
            transform: translateX(3px);
        }
        /* --- SZTYWNA WYSOKOŚĆ I WEWNĘTRZNY SCROLL TABELI --- */
        .table-container-scrollable {
            max-height: calc(100vh - 220px); /* Dopasowuje wysokość do ekranu, odejmując marginesy górne */
            overflow-y: auto !important;     /* Włącza pionowy pasek przewijania tylko wewnątrz tabeli */
            position: relative;
        }
        /* Zablokowanie uciekania nagłówka tabeli podczas przewijania (Sticky Header) */
        .table-container-scrollable thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--card-hdr-bg) !important;
        }

        /* --- PEŁNA WYSOKOŚĆ STRONY GŁÓWNEJ --- */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Blokuje główny pasek przewijania przeglądarki */
        }
        .full-height-wrapper {
            height: calc(100vh - 76px); /* Odejmuje wysokość górnego paska nawigacji */
            display: flex;
            flex-direction: column;
        }
        .full-height-row {
            flex: 1;
            min-height: 0; /* Kluczowe dla flexboxa, żeby dzieci mogły się scrollować */
        }
        /* Lewa kolumna: ma naturalną wysokość i nie rozciąga się w pionie */
        .sidebar-col {
            height: auto;
            align-self: flex-start; /* NOWOŚĆ: Blokuje rozciąganie na wysokość rzędu */
        }
        
        /* Prawa kolumna: rozciąga się na pełną wysokość i zarządza tabelą */
        .content-col {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
    </style>


</head>
<!-- Automatyczne wykrywande motywu zalogowanego użytkownika -->
<body class="{% if user.is_authenticated and user.profile %}theme-{{ user.profile.theme }}{% else %}theme-mint{% endif %}">

    <!-- Górny pasek oparty o klasę dynamiczną -->
    <nav class="navbar navbar-expand-lg custom-navbar mb-4 shadow-sm">
        <div class="container-fluid">
            
            <!-- NOWOŚĆ: Połączona ikona Home i nazwa systemu ze Spółką -->
            <a class="navbar-brand text-white d-flex align-items-center text-decoration-none" href="{% url 'moje_biurko' %}">
                <!-- Ikona domku z marginesem po prawej -->
                <i class="bi bi-house-door-fill fs-3 me-3 text-white-50 hover-white transition"></i>
                
                <!-- Blok z tekstami ułożonymi jeden pod drugim -->
                <div class="d-flex flex-column justify-content-center" style="line-height: 1.2;">
                    <span class="fw-bold fs-5">DMS KSeF</span>
                    <span style="font-size: 0.65rem; font-weight: normal; opacity: 0.85;">
                        {{ COMPANY_NAME }} | NIP: {{ COMPANY_NIP }} | Database: {{ DB_SERVER_NAME }}
                    </span>
                </div>
            </a>
            
            <div class="collapse navbar-collapse">
                <!-- Puste menu me-auto, żeby wypchnąć profil użytkownika na prawą stronę (usunięto stary tekst "Moje Biurko") -->
                <ul class="navbar-nav me-auto">
                </ul>
                
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <div class="dropdown">
                            <button class="btn btn-outline-light dropdown-toggle rounded px-3 shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-person-circle me-1"></i> 
                                {% if user.first_name %}
                                    {{ user.first_name }} {{ user.last_name }}
                                {% else %}
                                    {{ user.username }}
                                {% endif %}
                            </button>
                            
                            <!-- Rozwijane menu korzystające z naszych klas CSS -->
                            <ul class="dropdown-menu dropdown-menu-end shadow mt-2 custom-dropdown-menu">
                                <li>
                                    <a class="dropdown-item custom-dropdown-item py-2" href="{% url 'ustawienia_profilu' %}">
                                        <i class="bi bi-gear me-2 text-secondary"></i> Ustawienia
                                    </a>
                                </li>
                                
                                <li><hr class="dropdown-divider custom-border"></li>
                                
                                <li>
                                    <!-- Wylogowanie realizowane bezpieczną metodą POST (Standard Django) -->
                                    <form action="{% url 'logout' %}" method="post" class="m-0 p-0 d-grid">
                                        {% csrf_token %}
                                        <button type="submit" class="dropdown-item py-2 text-danger fw-bold" style="background: transparent; border: none; text-align: left;">
                                            <i class="bi bi-box-arrow-right me-2"></i> Wyloguj
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
